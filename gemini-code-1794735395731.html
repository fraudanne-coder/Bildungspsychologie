<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bildungspsychologie – Audio-Lernkarten</title>
    <style>
        :root {
            --bg: #f3f5f2;
            --card: #ffffff;
            --primary: #4a6b5d;
            --primary-hover: #3a564a;
            --accent: #d97742;
            --text: #24302b;
            --muted: #65756e;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 560px;
            background: var(--card);
            border-radius: 20px;
            padding: 28px 24px;
            box-shadow: 0 10px 30px rgba(36, 48, 43, 0.08);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            font-size: 0.9rem;
            color: var(--muted);
        }
        .mode-toggle {
            background: #e7ece8;
            border: none;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
            font-weight: 600;
        }
        .mode-toggle.active {
            background: var(--primary);
            color: white;
        }
        .concept-box {
            background: #edf2ef;
            border-left: 5px solid var(--primary);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 18px;
        }
        .concept-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 6px;
        }
        .concept-title {
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.3;
            margin: 0;
        }
        .answer-box {
            background: #fafbfa;
            border: 1px solid #dfe6e2;
            border-radius: 12px;
            padding: 18px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 20px;
            line-height: 1.55;
            font-size: 1.05rem;
        }
        .hidden-hint {
            color: var(--muted);
            text-align: center;
            font-style: italic;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button.btn {
            padding: 13px 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button.btn:active { transform: scale(0.98); }
        .btn-reveal {
            background: var(--accent);
            color: white;
            grid-column: span 2;
        }
        .btn-audio {
            background: var(--primary);
            color: white;
        }
        .btn-audio:hover { background: var(--primary-hover); }
        .btn-next {
            background: #e2e8e4;
            color: var(--text);
        }
        .btn-next:hover { background: #d4ddd7; }
        .nav-row {
            display: flex;
            justify-content: space-between;
            margin-top: 14px;
        }
        .nav-small {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 4px 8px;
        }
        .nav-small:hover { color: var(--text); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <span id="counter">Lade Karten...</span>
        <button class="mode-toggle" id="autoplay-btn" onclick="toggleAutoplay()">🎧 Auto-Hörmodus: AUS</button>
    </div>

    <div class="concept-box">
        <div class="concept-label">Konzept / Theorie</div>
        <h1 class="concept-title" id="concept-title">---</h1>
    </div>

    <div class="answer-box" id="answer-box">
        <div class="hidden-hint">Versuche die Kernaussage kurz im Kopf abzurufen und decke dann auf.</div>
    </div>

    <div class="controls" id="controls">
        <button class="btn btn-reveal" id="reveal-btn" onclick="revealCard()">Antwort zeigen & anhören</button>
    </div>

    <div class="nav-row">
        <button class="nav-small" onclick="prevCard()">← Zurück</button>
        <button class="nav-small" onclick="shuffleCards()">🔀 Mischen</button>
        <button class="nav-small" onclick="nextCard()">Weiter →</button>
    </div>
</div>

<script>
    let cards = [];
    let currentIndex = 0;
    let isRevealed = false;
    let autoplayMode = false;
    let currentAudio = null;

    async function loadCards() {
        try {
            const response = await fetch('bildungspsychologie.csv');
            const text = await response.text();
            const lines = text.trim().split(/\r?\n/);
            const delimiter = lines[0].includes(';') ? ';' : ',';

            cards = [];
            for (let i = 0; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const cols = lines[i].split(delimiter);
                if (cols.length < 2) continue;

                const term = cols[0].trim();
                // Falls im Erklärungstext selbst ein Semikolon vorkam, wieder zusammenfügen
                const explanation = cols.slice(1).join(delimiter).trim();
                const id = String(i + 1);

                if (term && explanation) {
                    cards.push({ id, term, explanation });
                }
            }
            renderCard();
        } catch (e) {
            document.getElementById('counter').textContent = "Fehler beim Laden der CSV.";
        }
    }

    function renderCard() {
        if (cards.length === 0) return;
        const card = cards[currentIndex];
        document.getElementById('counter').textContent = `Karte ${currentIndex + 1} von ${cards.length}`;
        document.getElementById('concept-title').textContent = card.term;

        if (autoplayMode) {
            revealCard(true);
        } else {
            isRevealed = false;
            document.getElementById('answer-box').innerHTML =
                '<div class="hidden-hint">Versuche die Kernaussage kurz im Kopf abzurufen und decke dann auf.</div>';
            document.getElementById('controls').innerHTML =
                '<button class="btn btn-reveal" onclick="revealCard(false)">Antwort zeigen & anhören</button>';
        }
    }

    function revealCard(fromAutoplay = false) {
        if (cards.length === 0) return;
        const card = cards[currentIndex];
        isRevealed = true;

        document.getElementById('answer-box').textContent = card.explanation;
        document.getElementById('controls').innerHTML = `
            <button class="btn btn-audio" onclick="playAudio()">🔊 Nochmal hören</button>
            <button class="btn btn-next" onclick="nextCard()">Nächste Karte →</button>
        `;
        playAudio(fromAutoplay);
    }

    function playAudio(autoAdvance = false) {
        if (cards.length === 0) return;
        const card = cards[currentIndex];
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
        }
        currentAudio = new Audio(`audio/${card.id}.mp3`);
        if (autoAdvance && autoplayMode) {
            currentAudio.onended = () => {
                setTimeout(() => {
                    if (autoplayMode) nextCard();
                }, 1500); // 1,5 Sekunden Pause zwischen den Karten
            };
        }
        currentAudio.play().catch(() => {});
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % cards.length;
        renderCard();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + cards.length) % cards.length;
        renderCard();
    }

    function shuffleCards() {
        cards.sort(() => Math.random() - 0.5);
        currentIndex = 0;
        renderCard();
    }

    function toggleAutoplay() {
        autoplayMode = !autoplayMode;
        const btn = document.getElementById('autoplay-btn');
        if (autoplayMode) {
            btn.textContent = "🎧 Auto-Hörmodus: AN";
            btn.classList.add('active');
            revealCard(true);
        } else {
            btn.textContent = "🎧 Auto-Hörmodus: AUS";
            btn.classList.remove('active');
            if (currentAudio) currentAudio.onended = null;
        }
    }

    loadCards();
</script>

</body>
</html>
